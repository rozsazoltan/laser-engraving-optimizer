[package]
name = "laser-engraving-optimizer"
version = "0.1.0"
edition = "2021"

[lib]
name = "laser_engraving_optimizer"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
rand = "0.8"
rfd = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
